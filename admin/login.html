<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — Shahedin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-card">
    <div class="admin-brand" style="justify-content:center;"><span class="dot"></span>Shahedin Admin</div>
    <p class="lead">Sign in to manage courses, products & analytics.</p>
    <div id="deniedNotice"></div>
    <form id="loginForm">
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Log in</button>
    </form>
    <p class="hint" style="margin-top:16px; text-align:center;">Access is limited to accounts added to the <code>admins</code> table in Supabase.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../js/supabase-config.js"></script>
<script src="js/admin-common.js"></script>
<script>
(async function () {
  if (!Admin.configured()) { Admin.showNotConfigured(); return; }

  const c = Admin.client();
  const { data: { session } } = await c.auth.getSession();
  if (session) {
    const { data: adminRow } = await c.from("admins").select("id").eq("id", session.user.id).maybeSingle();
    if (adminRow) { window.location.href = "index.html"; return; }
  }

  if (new URLSearchParams(location.search).get("denied")) {
    document.getElementById("deniedNotice").innerHTML =
      `<div class="notice">That account isn't set up as an admin yet. Ask whoever manages the Supabase project to add your user ID to the <code>admins</code> table.</div>`;
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.textContent = "Signing in…";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { data, error } = await c.auth.signInWithPassword({ email, password });
    if (error) {
      btn.disabled = false;
      btn.textContent = "Log in";
      Admin.toast(error.message || "Couldn't sign in.", true);
      return;
    }
    const { data: adminRow } = await c.from("admins").select("id").eq("id", data.user.id).maybeSingle();
    if (!adminRow) {
      await c.auth.signOut();
      btn.disabled = false;
      btn.textContent = "Log in";
      window.location.href = "login.html?denied=1";
      return;
    }
    window.location.href = "index.html";
  });
})();
</script>
</body>
</html>
